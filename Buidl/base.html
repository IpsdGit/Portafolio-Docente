<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portafolio Docente{% endblock %} – UNAH</title>
    <meta name="description" content="Sistema de gestión de portafolio de formación continua para docentes universitarios.">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos institucionales -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head_extra %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ──────────────────────────────────────────────────────────────
     OVERLAY DE CARGA GLOBAL — aparece al enviar formularios con archivos
────────────────────────────────────────────────────────────── -->
<div id="loading-overlay" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.65); z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:1rem;">
  <div class="spinner-border text-warning" style="width:3.5rem; height:3.5rem;" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
  <div style="color:white; font-size:1rem; font-weight:600; letter-spacing:0.03em;" id="loading-msg">Subiendo archivo…</div>
</div>

<script>
/* ── Utilidades globales ──────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function () {

  /* 1. Auto-dismiss de alertas flash (desaparecen en 5 segundos) */
  document.querySelectorAll('.alert-pro').forEach(function (el) {
    setTimeout(function () {
      el.style.transition = 'opacity 0.5s ease, transform 0.5s ease, margin 0.5s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(-10px)';
      el.style.marginBottom = '0';
      el.style.overflow = 'hidden';
      el.style.maxHeight = el.offsetHeight + 'px';
      requestAnimationFrame(function() {
        el.style.maxHeight = '0';
        el.style.padding = '0';
      });
      setTimeout(function () { el.remove(); }, 600);
    }, 5000);
  });

  /* 2. Loading overlay al enviar formularios con archivos adjuntos */
  const overlay  = document.getElementById('loading-overlay');
  const loadMsg  = document.getElementById('loading-msg');

  document.querySelectorAll('form[enctype="multipart/form-data"]').forEach(function (form) {
    form.addEventListener('submit', function () {
      const hasFile = Array.from(form.querySelectorAll('input[type="file"]'))
                           .some(function (inp) { return inp.files && inp.files.length > 0; });
      if (hasFile && overlay) {
        overlay.style.display = 'flex';
        if (loadMsg) loadMsg.textContent = 'Subiendo archivo, por favor espera…';
        /* Deshabilitar el botón submit para evitar doble envío */
        const btn = form.querySelector('[type="submit"]');
        if (btn) {
          btn.disabled = true;
          const original = btn.innerHTML;
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Subiendo…';
        }
      }
    });
  });

});
</script>

{% block scripts %}{% endblock %}
</body>
</html>
